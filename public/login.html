<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0" />
  <meta name="theme-color" content="#3b82f6" />
  <link rel="manifest" href="/manifest.json" />
  <title>Login / Signup | Civic AI</title>
  <link rel="stylesheet" href="/css/style.css" />
</head>
<body>
  <div class="bg-glow" aria-hidden="true"></div>
  <nav class="navbar">
    <div class="nav-brand"><a href="index.html">Civic AI</a></div>
    <button class="hamburger" id="hamburgerBtn" aria-label="Menu"><span></span><span></span><span></span></button>
    <div class="nav-overlay" id="navOverlay"></div>
    <div class="nav-menu" id="navMenu">
      <a href="index.html">Home</a>
      <a href="cases.html">Cases</a>
      <a href="report.html">Report Issue</a>
      <a href="team.html">Team Hexagon</a>
      <a href="help.html">Help Desk</a>
      <div id="authArea"></div>
    </div>
  </nav>

  <main class="container">
    <div class="auth-container">
      <div class="card">
        <h1 class="page-title text-center" id="authTitle">Citizen Login</h1>
        <p class="page-subtitle text-center" id="authSubtitle">Login or create an account</p>
        <div id="alertBox"></div>
        <div class="tabs" id="citizenTabs">
          <div class="tab active" data-tab="login">Login</div>
          <div class="tab" data-tab="signup">Signup</div>
        </div>
        <form class="auth-form active" id="loginForm" onsubmit="handleLogin(event)">
          <div class="form-group">
            <label>Username / Email</label>
            <input type="text" class="form-control" id="loginUser" required autocomplete="username" />
          </div>
          <div class="form-group">
            <label>Password</label>
            <input type="password" class="form-control" id="loginPass" required autocomplete="current-password" />
          </div>
          <button type="submit" class="btn btn-primary w-full">Login</button>
        </form>
        <form class="auth-form" id="signupForm" onsubmit="handleSignup(event)">
          <div class="form-group">
            <label>Username (unique)</label>
            <input type="text" class="form-control" id="signupUser" required minlength="3" />
          </div>
          <div class="form-group">
            <label>Password</label>
            <input type="password" class="form-control" id="signupPass" required minlength="4" />
          </div>
          <div class="form-group">
            <label>Confirm Password</label>
            <input type="password" class="form-control" id="signupPass2" required minlength="4" />
          </div>
          <button type="submit" class="btn btn-primary w-full">Create Account</button>
        </form>
        <p class="mt-2 text-center" style="font-size:0.85rem;color:var(--muted)">
          Staff? <a href="login.html?staff=1">Staff Login</a>
        </p>
      </div>
    </div>
  </main>

  <footer class="footer">
    <p>© 2026 Civic AI Platform</p>
    <p class="powered">Powered by <strong>Dex</strong> · Team Hexagon</p>
  </footer>

  <script src="/js/app.js"></script>
  <script src="/js/auth.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', initAuthUI);
    const isStaff = new URLSearchParams(location.search).get('staff') === '1';
    if (isStaff) {
      document.getElementById('authTitle').textContent = 'Staff Login';
      document.getElementById('authSubtitle').textContent = 'Municipal staff only';
      document.getElementById('citizenTabs').classList.add('hidden');
      document.getElementById('signupForm').classList.remove('active');
      document.getElementById('loginForm').classList.add('active');
      document.getElementById('loginUser').placeholder = 'daksh@admin.com';
    }
    document.querySelectorAll('.tab').forEach(tab => {
      tab.addEventListener('click', () => {
        document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
        document.querySelectorAll('.auth-form').forEach(f => f.classList.remove('active'));
        tab.classList.add('active');
        document.getElementById(tab.dataset.tab + 'Form').classList.add('active');
      });
    });
    async function handleLogin(e) {
      e.preventDefault();
      const result = await loginUser(document.getElementById('loginUser').value.trim(), document.getElementById('loginPass').value, isStaff);
      document.getElementById('alertBox').innerHTML = '<div class="alert alert-' + (result.ok ? 'success' : 'error') + '">' + result.message + '</div>';
      if (result.ok) { if (typeof showToast==='function') showToast(result.message||'Welcome!', 'success'); setTimeout(() => location.href = isStaff ? 'cases.html' : 'report.html', 700); }
    }
    async function handleSignup(e) {
      e.preventDefault();
      const p1 = document.getElementById('signupPass').value;
      const p2 = document.getElementById('signupPass2').value;
      if (p1 !== p2) {
        document.getElementById('alertBox').innerHTML = '<div class="alert alert-error">Passwords do not match</div>';
        return;
      }
      const result = await signupUser(document.getElementById('signupUser').value.trim(), p1);
      document.getElementById('alertBox').innerHTML = '<div class="alert alert-' + (result.ok ? 'success' : 'error') + '">' + result.message + '</div>';
      if (result.ok) { if (typeof showToast==='function') showToast('Account created!', 'success'); setTimeout(() => location.href = 'report.html', 700); }
    }
  </script>
</body>
</html>
