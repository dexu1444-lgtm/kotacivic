<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0" />
  <meta name="theme-color" content="#3b82f6" />
  <link rel="manifest" href="/manifest.json" />
  <title>Cases | Kota Civic</title>
  <link rel="stylesheet" href="/css/style.css" />
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" media="print" onload="this.media='all'" />
</head>
<body>
  <nav class="navbar">
    <div class="nav-brand"><a href="index.html">Kota Civic</a></div>
    <button class="hamburger" id="hamburgerBtn" type="button" aria-label="Menu"><span></span><span></span><span></span></button>
    <div class="nav-overlay" id="navOverlay"></div>
    <div class="nav-menu" id="navMenu">
      <a href="index.html">Home</a>
      <a href="cases.html" class="active">Cases</a>
      <a href="report.html">Report Issue</a>
      <a href="team.html">Team Hexagon</a>
      <a href="help.html">Help Desk</a>
      <div id="authArea"></div>
    </div>
  </nav>

  <main class="container">
    <div class="card-header" style="margin-bottom:0.5rem">
      <div>
        <h1 class="page-title"><span class="live-dot"></span>All Cases</h1>
        <p class="page-subtitle" style="margin-bottom:0">Visible to everyone · synced from server</p>
      </div>
      <button type="button" class="btn btn-outline btn-sm" id="refreshBtn">↻ Refresh</button>
    </div>

    <div class="filters">
      <button type="button" class="filter-btn active" data-filter="all">All</button>
      <button type="button" class="filter-btn" data-filter="open">Open</button>
      <button type="button" class="filter-btn" data-filter="in_progress">In Progress</button>
      <button type="button" class="filter-btn" data-filter="resolved">Resolved</button>
      <button type="button" class="filter-btn" data-filter="rejected">Rejected</button>
      <button type="button" class="filter-btn" data-filter="priority">Priority</button>
    </div>

    <div class="card">
      <div id="map" style="height:240px"></div>
      <div class="map-legend">
        <span><i class="legend-dot legend-open"></i> Open</span>
        <span><i class="legend-dot legend-progress"></i> In Progress</span>
        <span><i class="legend-dot legend-resolved"></i> Resolved</span>
        <span><i class="legend-dot legend-rejected"></i> Rejected</span>
      </div>
    </div>

    <div id="issuesList" class="loading-text">Loading cases from server…</div>
  </main>

  <footer class="footer">
    <p>© 2026 Kota Civic</p>
    <p class="powered">Powered by <strong>Dex</strong> · Team Hexagon</p>
  </footer>

  <button class="chatbot-toggle" id="chatToggle" type="button">💬</button>
  <div class="chatbot-window" id="chatWindow">
    <div class="chatbot-header"><span>Assistant</span>
      <button type="button" onclick="toggleChat()" style="background:none;border:none;color:#fff;cursor:pointer;font-size:1.2rem">✕</button>
    </div>
    <div class="chatbot-messages" id="chatMessages"><div class="chat-msg bot">Ask about cases or reporting.</div></div>
    <div class="chatbot-input-area">
      <input type="text" id="chatInput" placeholder="Ask…" onkeydown="if(event.key==='Enter')sendChat()" />
      <button type="button" onclick="sendChat()">Send</button>
    </div>
  </div>

  <script src="/js/app.js"></script>
  <script src="/js/auth.js"></script>
  <script src="/js/chatbot.js"></script>
  <script>
    let currentFilter = 'all';
    let allIssues = [];

    async function reload() {
      const list = document.getElementById('issuesList');
      list.innerHTML = '<div class="skeleton skeleton-card"></div><div class="skeleton skeleton-card"></div><div class="skeleton skeleton-card"></div>';
      allIssues = await fetchIssues();
      renderIssues();
      if (window.initMap) initMap(allIssues);
    }

    function renderIssues() {
      const list = document.getElementById('issuesList');
      let filtered = allIssues;
      if (currentFilter === 'priority') filtered = allIssues.filter(i => i.priority);
      else if (currentFilter !== 'all') filtered = allIssues.filter(i => i.status === currentFilter);

      if (!filtered.length) {
        list.innerHTML = '<p class="loading-text">No cases yet. Be the first to <a href="report.html">report an issue</a>.</p>';
        return;
      }
      const isStaff = getCurrentUser()?.role === 'staff';
      list.innerHTML = filtered.map(issue => {
        const st = issue.status === 'in_progress' ? 'progress' : issue.status;
        return '<div class="issue-card">' +
          '<div class="card-header"><strong>' + escapeHtml(issue.type) + ' — ' + escapeHtml(issue.location) + '</strong>' +
          '<span class="badge badge-' + st + '">' + formatStatus(issue.status) + '</span></div>' +
          (issue.priority ? '<span class="badge badge-priority">Priority</span>' : '') +
          '<p style="font-size:0.88rem;color:var(--muted);margin:0.35rem 0">' + escapeHtml(issue.description || '') + '</p>' +
          '<div class="issue-meta"><span>#' + (issue.id || '').slice(0, 8) + '</span><span>' +
          escapeHtml(issue.reporter || 'Citizen') + '</span><span>' +
          new Date(issue.createdAt).toLocaleString() + '</span></div>' +
          '<div class="progress-bar"><div class="progress-fill progress-' + st + '"></div></div>' +
          (issue.photo ? '<img src="' + issue.photo + '" class="photo-preview" style="display:block;max-height:140px;margin-top:0.5rem" alt="" />' : '') +
          (isStaff ? '<div class="staff-actions">' +
            '<button type="button" class="btn btn-sm btn-warning" onclick="updateStatus(\'' + issue.id + '\',\'in_progress\')">In Progress</button>' +
            '<button type="button" class="btn btn-sm btn-success" onclick="updateStatus(\'' + issue.id + '\',\'resolved\')">Resolve</button>' +
            '<button type="button" class="btn btn-sm btn-danger" onclick="updateStatus(\'' + issue.id + '\',\'rejected\')">Reject</button>' +
            '<button type="button" class="btn btn-sm btn-ghost" onclick="deleteIssue(\'' + issue.id + '\')">Remove</button>' +
            '<button type="button" class="btn btn-sm btn-outline" onclick="togglePriority(\'' + issue.id + '\')">' +
            (issue.priority ? 'Unmark' : 'Mark') + ' Priority</button></div>' : '') +
          '</div>';
      }).join('');
    }

    async function updateStatus(id, status) {
      const res = await api('/api/issues', { method: 'PATCH', body: JSON.stringify({ id, status }) });
      if (res.ok) await reload();
      else alert(res.message || 'Staff login required');
    }
    async function deleteIssue(id) {
      if (!confirm('Remove this case?')) return;
      const res = await api('/api/issues', { method: 'DELETE', body: JSON.stringify({ id }) });
      if (res.ok) await reload();
    }
    async function togglePriority(id) {
      const issue = allIssues.find(i => i.id === id);
      const res = await api('/api/issues', { method: 'PATCH', body: JSON.stringify({ id, priority: !issue?.priority }) });
      if (res.ok) await reload();
    }
    function formatStatus(s) {
      return { open: 'Open', in_progress: 'In Progress', resolved: 'Resolved', rejected: 'Rejected' }[s] || s;
    }

    document.addEventListener('DOMContentLoaded', async () => {
      initAuthUI();
      document.getElementById('refreshBtn').addEventListener('click', reload);
      document.querySelectorAll('.filter-btn').forEach(btn => {
        btn.addEventListener('click', () => {
          document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
          btn.classList.add('active');
          currentFilter = btn.dataset.filter;
          renderIssues();
        });
      });
      await reload();
      const s = document.createElement('script');
      s.src = 'https://unpkg.com/leaflet@1.9.4/dist/leaflet.js';
      s.onload = () => {
        const m = document.createElement('script');
        m.src = '/js/map.js';
        m.onload = () => initMap(allIssues);
        document.body.appendChild(m);
      };
      document.body.appendChild(s);
    });
  </script>
</body>
</html>
